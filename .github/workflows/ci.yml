name: CI

on:
  push:
    branches: [main]
  pull_request:

# KHÔNG đặt `RUSTFLAGS: -D warnings` ở đây.
# RUSTFLAGS áp cho cả thư viện bên thứ ba, nên một cảnh báo trong crate của
# người khác (hoặc từ phiên bản trình biên dịch mới hơn) sẽ làm gãy build dù
# mã của ta không sai. Thay vào đó truyền `-D warnings` trực tiếp cho clippy,
# nơi nó chỉ áp cho crate của workspace.
env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Máy phát triển là Windows: hai crate không phụ thuộc OS phải test được ở đó
  # (bản đặc tả NFR-5, mục 3.5.6).
  windows:
    name: Test trên Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core và db
        run: cargo test -p nasdedup-core -p nasdedup-db

  linux:
    name: Kiểm tra đầy đủ trên Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Định dạng
        run: cargo fmt --all -- --check
      # Phát lỗi clippy ra dạng annotation để đọc được ngay trên giao diện
      # GitHub và qua API, không phải mở log. Log của kho công khai vẫn cần
      # xác thực mới tải được, nên annotation là kênh chẩn đoán duy nhất.
      - name: Clippy
        run: |
          set +e
          out=$(cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -E "(error|warning)(\[|:)" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code
      - name: Test
        run: |
          set +e
          out=$(cargo test --workspace 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -E "^(test .* FAILED|error|thread .* panicked|assertion)" | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

  # Test cần filesystem thật: dựng Btrfs trên file loop rồi kiểm những thứ mà
  # tmpfs/ext4 không mô phỏng được — nhất là việc mọi subvolume Btrfs đều dùng lại
  # inode 256/257, nên `(sub_id, ino)` thiếu `sub_id` sẽ coi hai file khác nhau là
  # một. Runner của GitHub có sudo không mật khẩu nên mount được.
  btrfs:
    name: Test trên Btrfs thật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cài btrfs-progs
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs
      - name: Build test
        run: cargo test -p nasdedup-linux --test btrfs_that --no-run
      # Chạy bằng sudo vì cần mount. `--ignored` để lấy đúng những test bị đánh dấu
      # bỏ qua mặc định; `NASDEDUP_IT_MOUNT` là công tắc của chính bộ test.
      - name: Chạy test Btrfs
        run: |
          set +e
          out=$(sudo -E env "PATH=$PATH" NASDEDUP_IT_MOUNT=1                 cargo test -p nasdedup-linux --test btrfs_that -- --ignored --test-threads=1 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -A1 -E "^(test .* FAILED|thread .* panicked|assertion)" | head -30 |               while IFS= read -r line; do echo "::error::${line}"; done
            exit $code
          fi
          # `--ignored` lọc ra không test nào thì cargo vẫn thoát mã 0; xem chú thích
          # cùng loại ở nhóm việc `io` bên dưới.
          if ! echo "$out" | grep -qE "test result: ok\. [1-9][0-9]* passed"; then
            echo "::error::nhóm việc Btrfs không chạy test nào — xanh giả"
            exit 1
          fi
          exit 0

  # Đo thật trên đĩa: ba tiêu chí hoàn thành của Phase 3 vốn được viết là "chạy
  # trên NAS rồi đọc `iostat`". Chúng không cần NAS — chỉ cần một đĩa block thật, mà
  # runner của GitHub có. Biến chúng thành test là để chúng chạy lại mỗi lần sửa code,
  # thay vì đo một lần rồi thôi.
  #
  # `--test-threads=1`: `/proc/self/io` và `/proc/diskstats` là số liệu toàn cục, hai
  # test đo song song sẽ làm bẩn số của nhau.
  #
  # Gọi từng `--test <tên>` một, không gộp: khi thiếu biến môi trường, các test này
  # **đỏ có chủ đích** thay vì trả về im lặng — một đường xanh giả còn tệ hơn không
  # có test (bài học BUG-018). Đổi lại, `cargo test -p nasdedup-linux -- --ignored`
  # gộp cả crate sẽ đỏ; đó là đánh đổi đã biết.
  #
  # `TMPDIR=/var/tmp`: phép đo cần một tầng block thật để đếm, tmpfs không có gì.
  # Không dùng `sudo`: `posix_fadvise` và `dd` đều không cần quyền root.
  io:
    name: Đo throttle trên đĩa thật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Môi trường đo
        run: |
          echo "thiết bị chứa thư mục làm việc:"
          df -h .
          lsblk -o NAME,MAJ:MIN,SIZE,TYPE,MOUNTPOINT || true
      - name: Build test
        run: cargo test -p nasdedup-linux --test io_that --test busy_that --no-run
      - name: Đo tốc độ đọc và kế toán byte (tiêu chí 1, 2)
        run: |
          set +e
          out=$(NASDEDUP_IT_IO=1 TMPDIR=/var/tmp cargo test -p nasdedup-linux --test io_that                 -- --ignored --test-threads=1 --nocapture 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -A1 -E "^(test .* FAILED|thread .* panicked|assertion)" | head -30               | while IFS= read -r line; do echo "::error::${line}"; done
            exit $code
          fi
          # `cargo test -- --ignored` mà lọc ra KHÔNG test nào vẫn thoát mã 0. Không
          # có dòng này thì đổi tên file test, gõ nhầm `--test`, hay lỡ bỏ `#[ignore]`
          # đều biến bước đo thành bước không đo gì mà vẫn xanh.
          if ! echo "$out" | grep -qE "test result: ok\. [1-9][0-9]* passed"; then
            echo "::error::bước đo không chạy test nào — xanh giả"
            exit 1
          fi
          exit 0
      - name: Đo phát hiện đĩa bận dưới tải thật (tiêu chí 3)
        run: |
          set +e
          out=$(NASDEDUP_IT_DISK=1 cargo test -p nasdedup-linux --test busy_that                   -- --ignored --test-threads=1 --nocapture 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -A1 -E "^(test .* FAILED|thread .* panicked|assertion)" | head -30               | while IFS= read -r line; do echo "::error::${line}"; done
            exit $code
          fi
          if ! echo "$out" | grep -qE "test result: ok\. [1-9][0-9]* passed"; then
            echo "::error::bước đo không chạy test nào — xanh giả"
            exit 1
          fi
          exit 0

  # Binary phát hành cho NAS là musl tĩnh (bản đặc tả NFR-4).
  # Không chạy trên pull request vì tốn nhiều phút; chỉ chạy khi đẩy lên main.
  musl:
    name: Build tĩnh musl
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      # cargo-binstall tải binary dựng sẵn thay vì biên dịch cross từ nguồn,
      # rút thời gian job từ vài phút xuống vài giây.
      - uses: cargo-bins/cargo-binstall@main
      - name: Cài cross
        run: cargo binstall --no-confirm cross
      - name: Build
        run: cross build --release --target ${{ matrix.target }} --bin nasdedup
      - name: Kiểm tra binary là tĩnh
        run: |
          f="target/${{ matrix.target }}/release/nasdedup"
          file "$f"
          # Binary động sẽ có dòng "interpreter"; binary tĩnh thì không.
          if readelf -l "$f" | grep -q "interpreter"; then
            echo "LỖI: binary không tĩnh, sẽ không chạy trên NAS thiếu thư viện"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nasdedup-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nasdedup
          retention-days: 14
