[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/linux", "crates/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/khanhhoang050120-lang/check_trung_video"

[workspace.dependencies]
nasdedup-core = { path = "crates/core" }
nasdedup-db = { path = "crates/db" }
nasdedup-linux = { path = "crates/linux" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
globset = "0.4"
jiff = { version = "0.1", features = ["tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
