[package]
name = "nasdedup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NAS video deduplicator daemon"

[lints]
workspace = true

[[bin]]
name = "nasdedup"
path = "src/main.rs"

[dependencies]
nasdedup-core.workspace = true
nasdedup-db.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
jiff.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nasdedup-linux.workspace = true
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
